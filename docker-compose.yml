services:
  postgres:
    image: postgres:16-alpine
    container_name: kawsaytech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kawsaytech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kawsaytech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
